name: Course and portal checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install pytest beautifulsoup4 nbformat
      - name: Inspect course structure and links
        run: python scripts/check_repository.py
      - name: Run deterministic logic and integrity tests
        run: python -m pytest -q
  portal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run test:logic
        working-directory: site
      - run: npm run build
        working-directory: site
